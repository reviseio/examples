# Publishes the examples that run without a server to GitHub Pages:
# https://<owner>.github.io/<repo>/<example>/
name: Deploy demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build static examples
        run: |
          mkdir -p site
          for example in docx-roundtrip custom-toolbar ai-redline review-portal; do
            (cd "$example" && npm ci && npm run build)
            cp -r "$example/dist" "site/$example"
          done
          cp pages-index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
